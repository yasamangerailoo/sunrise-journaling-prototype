<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Journal Templates | Sunrise</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        .templates-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .templates-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .templates-header h1 {
            margin-bottom: 10px;
        }

        #templateList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .template-card {
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            border: 3px solid transparent;
        }

        .template-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            border-color: var(--secondary);
        }

        .template-card h3 {
            color: var(--secondary);
            margin-bottom: 15px;
            font-size: 22px;
        }

        .template-card p {
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 20px;
            min-height: 60px;
        }

        .use-template-btn {
            width: 100%;
            padding: 10px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            font-size: 14px;
            margin: 0;
        }

        .use-template-btn:hover {
            background: #126782;
        }

        .back-link {
            text-align: center;
        }

        .back-link a {
            color: var(--secondary);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="templates-container">
        <div class="templates-header">
            <h1>📋 Journal Templates</h1>
            <p style="color: var(--muted);">Choose a template to guide your reflection</p>
        </div>

        <div id="templateList">
            <!-- Templates will be loaded here -->
        </div>

        <div class="back-link">
            <a href="journal-selection.html">← Back to Selection</a>
        </div>
    </div>

    <script src="js/journal.js"></script>
    <script>
        // Load templates when page loads
        loadTemplates();
    </script>

</body>

</html>
