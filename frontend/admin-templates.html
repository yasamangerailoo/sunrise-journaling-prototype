<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Templates | Admin</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div style="max-width: 1200px; margin: 40px auto; padding: 20px;">
        
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div>
                <h1>📋 Manage Templates</h1>
                <p style="color: #666;">Add, edit, or delete journal templates</p>
            </div>
            <button id="addTemplateBtn" style="background: #1a9cb8; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;">
                ➕ Add New Template
            </button>
        </div>

        <!-- Templates List -->
        <div id="templatesList"></div>

        <!-- Back Link -->
        <div style="text-align: center; margin-top: 20px;">
            <a href="admin-dashboard.html" style="color: #1a9cb8; text-decoration: none;">← Back to Admin Dashboard</a>
        </div>

    </div>

    <!-- Modal -->
    <div id="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 30px; border-radius: 12px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;">
            
            <h2 style="color: #1a9cb8; margin-bottom: 20px;">Add New Template</h2>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px;">Template Title *</label>
                <input type="text" id="templateTitle" placeholder="e.g., Morning Reflection" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 8px;">Description</label>
                <textarea id="templateDescription" placeholder="Describe what this template is for..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; min-height: 80px;"></textarea>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; margin-bottom: 10px;">Prompts (Questions)</label>
                <div id="promptsContainer">
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <input type="text" class="prompt-field" placeholder="Enter a prompt question..." style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                        <button onclick="window.addPromptFieldFunc()" style="background: #1a9cb8; color: white; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer;">➕</button>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button id="cancelBtn" style="flex: 1; padding: 12px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;">Cancel</button>
                <button id="saveBtn" style="flex: 1; padding: 12px; background: #1a9cb8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;">Save Template</button>
            </div>

        </div>
    </div>

    <script>
        // No external dependencies
        const TEMPLATES_API = 'http://127.0.0.1:8000/api';

        // Check if admin
        const token = localStorage.getItem('token');
        const isStaff = localStorage.getItem('is_staff');
        if (!token || isStaff !== 'true') {
            alert('Admin access required!');
            window.location.href = 'login.html';
        }

        // Add Prompt Field
        window.addPromptFieldFunc = function() {
            const container = document.getElementById('promptsContainer');
            const div = document.createElement('div');
            div.style.cssText = 'display: flex; gap: 10px; margin-bottom: 10px;';
            div.innerHTML = `
                <input type="text" class="prompt-field" placeholder="Enter a prompt question..." style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                <button onclick="this.parentElement.remove()" style="background: #dc3545; color: white; padding: 10px 12px; border: none; border-radius: 8px; cursor: pointer;">×</button>
            `;
            container.appendChild(div);
        };

        // Open Modal
        document.getElementById('addTemplateBtn').onclick = function() {
            console.log('Button clicked!');
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('templateTitle').value = '';
            document.getElementById('templateDescription').value = '';
            document.getElementById('promptsContainer').innerHTML = `
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" class="prompt-field" placeholder="Enter a prompt question..." style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                    <button onclick="window.addPromptFieldFunc()" style="background: #1a9cb8; color: white; padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer;">➕</button>
                </div>
            `;
        };

        // Close Modal
        document.getElementById('cancelBtn').onclick = function() {
            document.getElementById('modal').style.display = 'none';
        };

        // Save Template
        document.getElementById('saveBtn').onclick = async function() {
            const title = document.getElementById('templateTitle').value.trim();
            const description = document.getElementById('templateDescription').value.trim();

            if (!title) {
                alert('Please enter a template title!');
                return;
            }

            const promptFields = document.querySelectorAll('.prompt-field');
            const prompts = [];
            promptFields.forEach(field => {
                const text = field.value.trim();
                if (text) prompts.push(text);
            });

            try {
                const response = await fetch(`${TEMPLATES_API}/journals/admin/templates/create/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify({
                        title: title,
                        description: description,
                        prompts: prompts
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Template created successfully! ✅');
                    document.getElementById('modal').style.display = 'none';
                    loadTemplates();
                } else {
                    alert('Error: ' + JSON.stringify(data));
                }
            } catch (error) {
                alert('Connection error: ' + error.message);
            }
        };

        // Load Templates
        async function loadTemplates() {
            const container = document.getElementById('templatesList');
            container.innerHTML = '<p style="text-align:center; color:#666;">Loading...</p>';

            try {
                const response = await fetch(`${TEMPLATES_API}/journals/templates/`, {
                    headers: { 'Authorization': `Token ${token}` }
                });

                const templates = await response.json();

                if (response.ok) {
                    if (templates.length === 0) {
                        container.innerHTML = '<p style="text-align:center; color:#666;">No templates yet. Add your first template!</p>';
                    } else {
                        let html = '';
                        templates.forEach(template => {
                            const prompts = template.prompts || [];
                            html += `
                                <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px;">
                                    <h3 style="color: #1a9cb8; margin-bottom: 8px;">${template.title}</h3>
                                    <p style="color: #666; font-size: 14px; margin-bottom: 15px;">${template.description || 'No description'}</p>
                                    ${prompts.length > 0 ? `
                                        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                                            <div style="font-weight: 600; margin-bottom: 10px;">📝 Prompts (${prompts.length}):</div>
                                            ${prompts.sort((a,b) => a.order - b.order).map(p => `
                                                <div style="padding: 8px 0; border-bottom: 1px solid #dee2e6;">${p.order}. ${p.text}</div>
                                            `).join('')}
                                        </div>
                                    ` : '<p style="color:#999; font-size:14px;">No prompts yet</p>'}
                                </div>
                            `;
                        });
                        container.innerHTML = html;
                    }
                } else {
                    container.innerHTML = '<p style="color:red;">Error loading templates</p>';
                }
            } catch (error) {
                container.innerHTML = '<p style="color:red;">Connection error</p>';
            }
        }

        // Load on page load
        loadTemplates();

        console.log('Script loaded successfully!');
    </script>
</body>
</html>
