<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Welcome | Sunrise</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f6d365, #fda085);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .box {
            background: white;
            width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        
        h1 {
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }
        
        .option {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            margin: 8px 0;
            cursor: pointer;
            transition: .2s;
        }
        
        .option:hover {
            background: #fff2e6;
        }
        
        .selected {
            background: #ff914d;
            color: white;
            border: none;
        }
        
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #ff914d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        
        button:hover {
            background: #ff7a26;
        }
        
        .small {
            margin-top: 10px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🌅 Welcome to Sunrise</h1>
        <p class="subtitle">What brings you here?</p>

        <div class="option">Improve my daily journaling</div>
        <div class="option">Track my mood</div>
        <div class="option">Practice mindfulness</div>
        <div class="option">Personal growth</div>
        <div class="option">Reduce stress & anxiety</div>
        <div class="option">Build better habits</div>
        <div class="option">Reflect on my day</div>
        <div class="option">Increase productivity</div>
        <div class="option">Understand my emotions</div>

        <button onclick="goLogin()">Continue</button>

        <p class="small">You can change these later</p>

    </div>

    <script>
        /* multi-select */
        document.querySelectorAll(".option").forEach(opt => {
            opt.addEventListener("click", () => {
                opt.classList.toggle("selected");
            });
        });

        function goLogin() {
            window.location.href = "login.html";
        }
    </script>

</body>

</html>
