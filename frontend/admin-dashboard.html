<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Sunrise</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .admin-header h1 {
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            color: white;
            text-align: center;
        }

        .stat-number {
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 16px;
            opacity: 0.9;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .action-card {
            background: var(--card);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            border: 3px solid transparent;
        }

        .action-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
        }

        .action-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .action-card h3 {
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition);
            display: block;
            margin: 30px auto 0;
        }

        .logout-btn:hover {
            background: #c82333;
        }
    </style>
</head>

<body>

    <div class="admin-container">
        <div class="admin-header">
            <h1>👑 Admin Dashboard</h1>
            <p style="color: var(--muted);">System Management & Overview</p>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Users</div>
                <div class="stat-number" id="totalUsers">-</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Total Journals</div>
                <div class="stat-number" id="totalJournals">-</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Active Templates</div>
                <div class="stat-number" id="totalTemplates">-</div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions-grid">
            <a href="admin-users.html" class="action-card">
                <div class="action-icon">👥</div>
                <h3>Manage Users</h3>
                <p style="color: var(--muted);">View and manage user accounts</p>
            </a>

            <a href="admin-templates.html" class="action-card">
                <div class="action-icon">📋</div>
                <h3>Manage Templates</h3>
                <p style="color: var(--muted);">Add, edit, or delete templates</p>
            </a>

            <a href="user-dashboard.html" class="action-card">
                <div class="action-icon">👤</div>
                <h3>User View</h3>
                <p style="color: var(--muted);">Switch to user dashboard</p>
            </a>
        </div>

        <button class="logout-btn" onclick="adminLogout()">🚪 Logout</button>
    </div>

    <script src="js/admin.js"></script>
    <script>
        // Load stats when page loads
        loadAdminStats();

        // Logout function
        function adminLogout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                localStorage.removeItem('is_staff');
                window.location.href = 'login.html';
            }
        }
    </script>

</body>

</html>
