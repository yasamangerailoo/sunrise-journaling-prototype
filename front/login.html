<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Login | Sunrise</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container" style="max-width:420px">
        <div class="card">
            <h2 style="text-align:center">🌅 Sunrise</h2>

            <label>Username</label>
            <input>

            <label>Password</label>
            <input type="password">

            <label>Role</label>
            <select id="role">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>

            <button onclick="login()">Login</button>

            <p class="small">
                User can also <a href="#" onclick="signup()">Sign‑up</a>
            </p>
        </div>
    </div>

    <script>
        function login() {
            const role = document.getElementById("role").value;
            location.href = role === "admin" ?
                "admin-dashboard.html" :
                "journal-history.html";
        }

        function signup() {
            alert("Sign‑up demo (frontend only)");
        }
    </script>

</body>

</html>
